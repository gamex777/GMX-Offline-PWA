<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset CSD Cache</title>
<style>
html,body{height:100%;margin:0;background:#111;color:#eee;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
main{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
strong{display:block;font-size:22px;margin-bottom:8px}.small{color:#aaa;font-size:13px}
</style>
</head>
<body><main><div><strong>Updating CSD…</strong><div id="status">Removing the previous offline cache.</div><p class="small">Your installed ROM library is kept.</p></div></main>
<script>
(async function(){
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.textContent='Cache cleared. Loading the Build 14…';
  }catch(e){
    status.textContent='Continuing with the update…';
  }
  setTimeout(()=>location.replace('./index.html?build=14.0.0&fresh='+Date.now()),500);
})();
</script></body></html>
